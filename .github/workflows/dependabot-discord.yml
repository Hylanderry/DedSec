# DedSec — Notificações do Discord para todas as atividades do repositório
# Cobre: PRs do Dependabot, criação de branches, merges e pushes diretos.
#
# Configuração necessária:
# 1. No GitHub: Settings → Secrets and variables → Actions → New repository secret
#    Name: DISCORD_WEBHOOK_URL
#    Value: (URL do webhook do Discord)

name: DedSec Discord Notifications

on:
  pull_request:
    types: [opened, synchronize, closed]
  create:
  push:
    branches-ignore:
      - 'dependabot/**'

permissions:
  pull-requests: read
  contents: read

jobs:
  notify-dependabot:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Notificar atualização do Dependabot
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL não configurada"
            exit 0
          fi
          python3 << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          title = os.environ.get("PR_TITLE", "Atualização de dependência")
          url = os.environ.get("PR_URL", "")
          author = os.environ.get("PR_AUTHOR", "dependabot[bot]")
          branch = os.environ.get("PR_BRANCH", "")
          body = os.environ.get("PR_BODY", "") or ""

          import re
          m = re.search(r"from\s+([\d.\w\-]+)\s+to\s+([\d.\w\-]+)", title, re.I)
          old_ver = m.group(1) if m else "desconhecida"
          new_ver = m.group(2) if m else "desconhecida"

          if "github-actions" in title.lower() or "github-actions" in branch:
              upd_type = "GitHub Action"
          elif "submodule" in title.lower() or "submodule" in branch:
              upd_type = "Submodulo"
          else:
              upd_type = "Dependencia"

          bl = body.lower()
          if "security" in bl or "cve" in bl:
              severity, color = "Seguranca", 15158332
          elif "breaking" in bl or "major" in bl:
              severity, color = "Atencao", 16776960
          else:
              severity, color = "Rotina", 5814783

          ascii_block = (
              "```\n"
              "| ATUALIZACAO DETECTADA NO DEDSEC   |\n"
              f"| {upd_type.upper():35s} |\n"
              "|---------------------------------------|\n"
              f"| Versao Anterior: {old_ver:19s} |\n"
              f"| Nova Versao:     {new_ver:19s} |\n"
              f"| Branch:          {branch[:19]:19s} |\n"
              f"| Severidade:      {severity:19s} |\n"
              "----------------------------------------\n"
              "| Em 1-3 dias apos o merge, o build  |\n"
              "| sera recompilado e testado.        |\n"
              "----------------------------------------```"
          )

          preview = body[:500].replace("\r\n", "\n").replace("\n", " ")
          if len(body) > 500:
              preview += "..."

          payload = {
              "content": "@everyone",
              "embeds": [{
                  "title": title,
                  "description": f"{ascii_block}\n\n**Detalhes:**\n{preview or 'Sem descricao adicional.'}",
                  "url": url,
                  "color": color,
                  "fields": [
                      {"name": "Link do PR", "value": f"[Clique aqui]({url})", "inline": False},
                      {"name": "Autor", "value": f"`{author}`", "inline": True},
                      {"name": "Tipo", "value": f"`{upd_type}`", "inline": True},
                      {"name": "Severidade", "value": f"`{severity}`", "inline": True}
                  ],
                  "footer": {"text": "DedSec Auto-Update"},
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              }]
          }

          webhook_url = os.environ["WEBHOOK_URL"].strip()
          data = json.dumps(payload).encode("utf-8")
          req = Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
          try:
              resp = urlopen(req)
              print(f"Notificacao enviada (HTTP {resp.status})")
          except HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              print(f"::error::Discord retornou HTTP {e.code}: {err_body}")
              print(f"::error::URL usada: {webhook_url[:50]}...")
              sys.exit(1)
          PYEOF

  notify-merge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Notificar merge no Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then exit 0; fi
          python3 << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          title = os.environ.get("PR_TITLE", "")
          url = os.environ.get("PR_URL", "")
          author = os.environ.get("PR_AUTHOR", "")
          branch = os.environ.get("PR_BRANCH", "")
          base = os.environ.get("BASE_BRANCH", "main")

          ascii_block = (
              "```\n"
              "| MERGE REALIZADO NO DEDSEC         |\n"
              "| Pull Request Aprovado e Mesclado  |\n"
              "|---------------------------------------|\n"
              f"| PR:     {title[:25]:25s} |\n"
              f"| De:     {branch[:25]:25s} |\n"
              f"| Para:   {base[:25]:25s} |\n"
              f"| Autor:  {author[:25]:25s} |\n"
              "----------------------------------------\n"
              "| O build sera recompilado e testado |\n"
              "| nas proximas horas.               |\n"
              "----------------------------------------```"
          )

          payload = {
              "content": "@everyone",
              "embeds": [{
                  "title": f"Merge: {title}",
                  "description": ascii_block,
                  "url": url,
                  "color": 3066993,
                  "fields": [
                      {"name": "Link do PR", "value": f"[Clique aqui]({url})", "inline": False}
                  ],
                  "footer": {"text": "DedSec CI - Merge detectado"},
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              }]
          }

          webhook_url = os.environ["WEBHOOK_URL"].strip()
          data = json.dumps(payload).encode("utf-8")
          req = Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
          try:
              resp = urlopen(req)
              print(f"Notificacao de merge enviada (HTTP {resp.status})")
          except HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              print(f"::error::Discord retornou HTTP {e.code}: {err_body}")
              sys.exit(1)
          PYEOF

  notify-branch:
    if: github.event_name == 'create' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Notificar nova branch no Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH_NAME: ${{ github.event.ref }}
          CREATOR: ${{ github.event.sender.login }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then exit 0; fi
          python3 << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          branch = os.environ.get("BRANCH_NAME", "")
          creator = os.environ.get("CREATOR", "")
          repo_url = os.environ.get("REPO_URL", "")

          if branch.startswith("dependabot/"):
              print("Branch do Dependabot ignorada")
              sys.exit(0)

          ascii_block = (
              "```\n"
              "| NOVA BRANCH CRIADA NO DEDSEC      |\n"
              "| Desenvolvimento em Andamento      |\n"
              "|---------------------------------------|\n"
              f"| Branch:  {branch[:27]:27s} |\n"
              f"| Criador: {creator[:27]:27s} |\n"
              "----------------------------------------\n"
              "| Trabalho em progresso. Aguarde o PR |\n"
              "| para revisao e merge.              |\n"
              "----------------------------------------```"
          )

          payload = {
              "content": "@everyone",
              "embeds": [{
                  "title": f"Nova Branch: `{branch}`",
                  "description": ascii_block,
                  "url": f"{repo_url}/tree/{branch}",
                  "color": 3447003,
                  "fields": [
                      {"name": "Criador", "value": f"`{creator}`", "inline": True},
                      {"name": "Branch", "value": f"`{branch}`", "inline": True}
                  ],
                  "footer": {"text": "DedSec Dev - Nova branch detectada"},
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              }]
          }

          webhook_url = os.environ["WEBHOOK_URL"].strip()
          data = json.dumps(payload).encode("utf-8")
          req = Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
          try:
              resp = urlopen(req)
              print(f"Notificacao de branch enviada (HTTP {resp.status})")
          except HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              print(f"::error::Discord retornou HTTP {e.code}: {err_body}")
              sys.exit(1)
          PYEOF

  notify-push:
    if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Notificar push direto no Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUSH_BRANCH: ${{ github.ref_name }}
          PUSHER: ${{ github.event.pusher.name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          REPO_URL: ${{ github.event.repository.html_url }}
          COMMIT_COUNT: ${{ github.event.commits_count || '1' }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then exit 0; fi
          python3 << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          branch = os.environ.get("PUSH_BRANCH", "")
          pusher = os.environ.get("PUSHER", "")
          commit_msg = os.environ.get("COMMIT_MSG", "").split("\n")[0][:60]
          repo_url = os.environ.get("REPO_URL", "")
          count = os.environ.get("COMMIT_COUNT", "1")

          if branch.startswith("dependabot/"):
              sys.exit(0)

          ascii_block = (
              "```\n"
              "| PUSH DIRETO NO DEDSEC             |\n"
              "| Commits Enviados                  |\n"
              "|---------------------------------------|\n"
              f"| Branch:   {branch[:26]:26s} |\n"
              f"| Autor:    {pusher[:26]:26s} |\n"
              f"| Commits:  {count:26s} |\n"
              f"| Mensagem: {commit_msg[:26]:26s} |\n"
              "----------------------------------------\n"
              "| Mudancas diretas na branch.       |\n"
              "| Verifique se testes passam.       |\n"
              "----------------------------------------```"
          )

          payload = {
              "content": "@everyone",
              "embeds": [{
                  "title": f"Push em `{branch}`",
                  "description": ascii_block,
                  "url": f"{repo_url}/commits/{branch}",
                  "color": 10181046,
                  "fields": [
                      {"name": "Autor", "value": f"`{pusher}`", "inline": True},
                      {"name": "Branch", "value": f"`{branch}`", "inline": True},
                      {"name": "Commit", "value": f"`{commit_msg}`", "inline": False}
                  ],
                  "footer": {"text": "DedSec CI - Push detectado"},
                  "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              }]
          }

          webhook_url = os.environ["WEBHOOK_URL"].strip()
          data = json.dumps(payload).encode("utf-8")
          req = Request(webhook_url, data=data, headers={"Content-Type": "application/json"})
          try:
              resp = urlopen(req)
              print(f"Notificacao de push enviada (HTTP {resp.status})")
          except HTTPError as e:
              err_body = e.read().decode("utf-8", errors="replace")
              print(f"::error::Discord retornou HTTP {e.code}: {err_body}")
              print(f"::error::URL usada (primeiros 60 chars): {webhook_url[:60]}...")
              sys.exit(1)
          PYEOF